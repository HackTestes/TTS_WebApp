<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            margin: 0;
            padding: 0;
        }

        /*Used to toggle the visibility of the pages*/
        .display_none_class
        {
            display: none !important; 
        }

        .Page
        {
            height: 100vh;
            width: 98vw;
            background-color: white;
        }

        #Pages
        {
            display: grid;
            grid-template-columns: 1fr;
        }

        #Pages div
        {
            grid-row-start: 1;
            grid-column-start: 1;
        }

        /*Each page will get 100 places in the z-index allocated*/
        /*Main page will get from 0-99 (inclusive)*/
        #PageMain
        {
            z-index: 0;
            display: grid;
            grid-template-columns: 1fr;
        }

        #PageMain div
        {
            grid-row-start: 1;
            grid-column-start: 1;
        }

        #TextViewer
        {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #TextViewer .TextPreview, #TextViewer mark
        {
            display: inline;
            white-space: pre-line;
        }

        mark
        {
            margin: 0;
            padding: 0;
            background-color: rgb(134, 175, 255);
        }

        #media-control-overlay
        {
            z-index: 99;
            margin: 0;
            top: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: row;
            position: fixed;
            opacity: 25%;
        }

        #media-control-back
        {
            margin: 0;
            top: 0;
            background-color: brown;
        }

        #media-control-front
        {
            margin: 0;
            top: 0;
            background-color: aquamarine;
        }

        /*The settings page will use z-index from 100 to 199. 100-199 (inclusive)*/
        #PageSettings
        {
            z-index: 100;
        }

        #VoiceSettings
        {
            flex-direction: column;
        }

        /* Orientation specific styles */
        @media screen and (orientation: landscape)
        {
            #media-control-overlay
            {
                flex-direction: row;
            }

            #media-control-back
            {
                height: 100vh;
                width: 50vw;
            }

            #media-control-front
            {
                height: 100vh;
                width: 50vw;
            }
        }

        /* Orientation specific styles */
        @media screen and (orientation: portrait)
        {
            #media-control-overlay
            {
                flex-direction: column;
            }

            #media-control-back
            {
                height: 50vh;
                width: 100vw;
            }

            #media-control-front
            {
                height: 50vh;
                width: 100vw;
            }
        }

    </style>
</head>
<body>

    <div id="Pages">
        <div id="PageMain" class="Page">
            <!--Invisible buttons that take the whole screen and represent the media controls-->
            <div id="media-control-overlay">
                <div id="media-control-back"></div>
                <div id="media-control-front"></div>
            </div>

            <div id="SkipTo"></div>

            <div id="TextViewer">

        <div id="PageSettings" class="display_none_class Page">

            <button type="button" id="close_settings">CloseSettings</button>

            <form action="" id="VoiceSettings">

</body>
<script>
    const main_page = document.getElementById("PageMain");
    const text_viewer = document.getElementById("TextViewer");
    const text_viewer_before = document.getElementById("TextViewer_Before");
    const text_viewer_current_word = document.getElementById("TextViewer_CurrentWord");
    const text_viewer_after = document.getElementById("TextViewer_After");

    const settings_page = document.getElementById("PageSettings");
    const close_settings_btn = document.getElementById("close_settings");
    const utterance_text_selector = document.getElementById("utterance_text");
    // Voice settings
    const voice_list_html = document.getElementById("voice_list");
    const utterance_voice_search = document.getElementById("utterance_voice_search");
    const utterance_lang_search = document.getElementById("utterance_lang_search");
    const utterance_voice_type_radio_btns = document.querySelectorAll('input[name="utterance_voice_type"]');
    const utterance_rate_selector = document.getElementById("utterance_rate");
    const utterance_pitch_selector = document.getElementById("utterance_pitch");
    const utterance_volume_selector = document.getElementById("utterance_volume");
    // Media control settings
    const replay_toggle = document.getElementById("media_control_settings_replay");
    const scroll_to_view_toggle = document.getElementById("media_control_settings_ScrollToView");
    const input_latency_selector = document.getElementById("media_control_settings_input_latency");
    const fastFoward_hold_speed_interval_selector = document.getElementById("media_control_settings_fastFoward_speed");
    const fastFoward_word_skip_selector = document.getElementById("media_control_settings_fastFoward_word_skip");
    const rewind_hold_speed_interval_selector = document.getElementById("media_control_settings_rewind_speed");
    const rewind_word_skip_selector = document.getElementById("media_control_settings_rewind_word_skip");
    // Text chunking settings
    const text_chunking_toggle = document.getElementById("text_chunking_toggle");
    const text_chunking_word_limit_selector = document.getElementById("text_chunking_word_limit");
    const text_chunking_char_limit_selector = document.getElementById("text_chunking_char_limit");
    // Advanced settings
    const chrome_workaround_toggle = document.getElementById("chrome_workaround_toggle");

    // Media control overlay
    const media_control_overlay = document.getElementById("media-control-overlay");
    const media_control_front = document.getElementById("media-control-front");
    const media_control_back = document.getElementById("media-control-back");

    // Used to keep track of inputs between multiple events, this is why they are global
    let global_timer;
    let global_interval;
    let key_hold = false;

    // https://developer.mozilla.org/en-US/docs/Web/API/Web_Speech_API/Using_the_Web_Speech_API
    const speech_synth = window.speechSynthesis;
    // Holds the full text, in case we only need a substring for the utterance
    let utterance_original_text = "";
    let utterance_text = "";
    let utterance_voice = undefined;
    let utterance = undefined;
    // character absolute index (relative to the full text) of where the TTS is currently at
    let current_char = 0;

    // Keep track of changes on voice settings
    // If we detect any changes, reload the TTS with the applied changes
    let voice_changed = false;

    // Keep track of new files added
    // If a new file was loaded but has not been added to the TTS, this should be TRUE
    // If the file was already added to the TTS as an utterance, this should be FALSE
    let new_file = false;

    // Keep track of play status manually and "ignore" the one returned by the WebSpeech API, since it might be buggy
    let speech_playing = false;

    // This function assumes that the substring goes all the all to the end.
    /* // ----------------- FULL STRING ----------------- //
                          // -------- SUB-STRING -------- // <-- This works
                                // ----- SUB-STRING ----- // <-- This works
                // -------- SUB-STRING -------- //           <-- This doesn't work
    */
    // curren_char_idx is relative to the sub_str
    function GetAbsoluteCharIndexFromSubstring(full_str, sub_str, curren_char_idx)
    {
        return (full_str.length - sub_str.length) + curren_char_idx;
    }

    function ChunkGetWordIndex(text)
    {
        // Find any character
        const word_start = text.search(`[^ \n\t]`);

        // Find where it ends
        const word_end = text.slice(word_start).search(`[ \t\n]`)+word_start;
    }

    function ChunkText(text, index_from, word_count, char_limit)
    {
        let char_count = 0;
        let chunk_start = index_from;
        let chunk_end = 0;

        for (let w = 0; w < word_count; w++)
        {
            // Find any character
            let word_start = text.slice(char_count+index_from).search(`[^ \n\t]`);

            // It means that we reached the end of the text and only found spaces
            if (word_start == -1)
            {
                // Remember that slice uses absolute indexes, so we must offset it with the start_idx of the slice
                return text.slice(index_from, index_from+char_limit);
            }
            // We found an actual character
            else
            {
                word_start += char_count + index_from;
            }

            // Find where it ends
            let word_end = text.slice(word_start).search(`[ \t\n]`);

            // It means it reached the end of the text
            if (word_end == -1)
            {
                word_end = text.slice(word_start).length + word_start;
            }
            else
            {
                word_end += word_start;
            }

            const tmp_char_count = word_end - (char_count+index_from);

            // This new word extrapolates our limit
            if (tmp_char_count+char_count > char_limit)
            {
                // Then, we can stop it here
                break;
            }

            // All is fine, then update the data
            char_count += tmp_char_count;
            chunk_end = word_end;
        }

        //console.log(`Text section:"${JSON.stringify(text.slice(index_from, char_limit))}"\n Chunk word_lim:${word_count}\n Chunk char_lim:${char_limit}\nchunk_start:${chunk_start}\nchunk_end:${chunk_end}\nResult:"${text.slice(chunk_start, chunk_end)}"`);

        return text.slice(chunk_start, chunk_end)
    }

    function ScrollToView(html_element, toggle)
    {
        if (toggle == true)
        {
            html_element.scrollIntoView({ behavior: "smooth", block: "center", inline: "center" });
        }
    }

    function CreateUtterance(urate, upitch, uvolume, uvoice, utext, start_from = 0, chunk_word_limit = 100, chunk_char_limit = 512)
    {
        let local_utterance = new SpeechSynthesisUtterance(utext);

        if (text_chunking_toggle.checked)
        {
            local_utterance = new SpeechSynthesisUtterance(ChunkText(utext, start_from, chunk_word_limit, chunk_char_limit));
        }
        else
        {
            local_utterance = new SpeechSynthesisUtterance(utext.slice(start_from));
        }

        local_utterance.rate = urate;
        local_utterance.pitch = upitch;
        local_utterance.volume = uvolume;
        local_utterance.voice = uvoice;
        local_utterance.lang = uvoice.lang;
        // Add new attributes
        local_utterance.startIndex = start_from;
        local_utterance.fullText = utext;

        utterance_text = utext;

        //console.log(local_utterance);

        // Attach to the events
        local_utterance.onboundary = (event) =>
        {
            const absolute_char_idx = event.utterance.startIndex + event.charIndex;

            // Update the UI using the full text and not just the slice given to the TTS
            if (scroll_to_view_toggle.checked == true)
            {
                text_viewer_before.textContent = utterance_original_text.slice(0, absolute_char_idx);
                text_viewer_current_word.textContent = utterance_original_text.slice(absolute_char_idx, absolute_char_idx+event.charLength);
                text_viewer_after.textContent = utterance_original_text.slice(absolute_char_idx+event.charLength);

                ScrollToView(text_viewer_current_word, scroll_to_view_toggle.checked);
            }

            if (speech_playing == true)
            {
                // Chrome workaround: the browser needs continuously to get resume calls or the TTS stops playing
                speech_synth.resume();

                // Update the charIndex as it speaks
                current_char = absolute_char_idx;
            }

        };

        local_utterance.onend = (event) =>
        {
            // Since this is the onend event, we can simply take the start index and the text length read by the TTS
            const absolute_char_idx = event.utterance.startIndex + event.utterance.text.length;

            // Only replay if enabled and if we really are the end
            if (replay_toggle.checked == true && absolute_char_idx == event.utterance.fullText.length)
            {
                // Recreate the utterance
                // Is this recursion safe?????
                utterance = CreateUtterance(urate, upitch, uvolume, uvoice, utterance_original_text, 0, chunk_word_limit, chunk_char_limit)
                AddUtteranceToTtsQueue(utterance);
            }

            // We aren't at the end, then we must get the next text chunk
            else if (speech_playing == true)
            {
                // Update the charIndex as it speaks
                current_char = absolute_char_idx;
                utterance = CreateUtterance(urate, upitch, uvolume, uvoice, utterance_original_text, absolute_char_idx, chunk_word_limit, chunk_char_limit);
                AddUtteranceToTtsQueue(utterance);
            }
        };

        return local_utterance
    }

    // This is a new fuction to accomodate all the browser workarounds
    function AddUtteranceToTtsQueue(utterance_instance)
    {
        // Clear the queue before sending a new utterance
        // This is a workaround for Safari and MS Edge (mobile)
        speech_synth.cancel();
        speech_synth.speak(utterance_instance);
    }

    function ClickActions(event)
    {
        // If we were previously holding the key, do not execute the click event
        // Make sure to clean the state before the next runs
        if (key_hold == true)
        {
            key_hold = false;
            return
        }

        // Cancel the previous timer and wait a bit to see if we need to execute another thing
        if (event.detail == 1)
        {
            clearTimeout(global_timer);
            global_timer = setTimeout(()=>{PlayPause(speech_synth)}, input_latency_selector.value);
        }

        // To be able to spam the button without triggering other actions, it is necessary to perform the action immediately (otherwiser the clearTimeout clears) and look for clicks higher or equal than 2
        // This won't allow spam for now because we will have the hold gesture to cover the same functionality.
        if (event.detail == 2)
        {
            // Cancel the previous event
            clearTimeout(global_timer)

            if (event.srcElement.id == "media-control-front")
            {
                global_timer = setTimeout(()=>{FastForward("", 0, 0)}, input_latency_selector.value);
            }

            else if (event.srcElement.id == "media-control-back")
            {
                global_timer = setTimeout(()=>{Rewind("", 0, 0)}, input_latency_selector.value);
            }
        }

        if (event.detail === 3)
        {
            // Cancel the previous event and also wait a bit
            clearTimeout(global_timer)
            global_timer = setTimeout(()=>{ShowSettings()}, input_latency_selector.value);
        }
    }

    function HoldActions(event)
    {
        event.preventDefault();
        clearTimeout(global_timer);
        clearInterval(global_interval);

        // Wait a bit of time and then execute continously the same thing
        if (event.srcElement.id == "media-control-front")
        {
            global_timer = setTimeout(() => { global_interval = setInterval(()=>{key_hold = true; FastForward("", 0, 0)}, fastFoward_hold_speed_interval_selector.value) }, input_latency_selector.value);
        }

        else if (event.srcElement.id == "media-control-back")
        {
            global_timer = setTimeout(() => { global_interval = setInterval(()=>{key_hold = true; Rewind("", 0, 0)}, rewind_hold_speed_interval_selector.value) }, input_latency_selector.value);
        }
        //console.log("mousedown")
    }

    function ClearGlobalTimers()
    {
        // Clear everything
        clearTimeout(global_timer);
        clearInterval(global_interval);
        //console.log("mouseup");
    }

    // Front btn
    media_control_front.addEventListener("click", ClickActions);

    // Hold action
    // Keep the key pressed to continuously run the action
    // When the key is removed, all of the timers are cleared before the click events
    media_control_front.addEventListener("mousedown", HoldActions);
    media_control_front.addEventListener("mouseup", ClearGlobalTimers);

    // Back btn
    media_control_back.addEventListener("click", ClickActions);

    // Hold action
    // Keep the key pressed to continuously run the action
    // When the key is removed, all of the timers are cleared before the click events
    media_control_back.addEventListener("mousedown", HoldActions);
    media_control_back.addEventListener("mouseup", ClearGlobalTimers);

    function PlayPause()
    {
        // There is no utterance
        if (utterance == undefined)
        {
            utterance = CreateUtterance(utterance_rate_selector.value, utterance_pitch_selector.value, utterance_volume_selector.value, utterance_voice, utterance_original_text, 0, text_chunking_word_limit_selector.value, text_chunking_char_limit_selector.value);
            AddUtteranceToTtsQueue(utterance);
        }

        // A new file was loaded, try again
        if (new_file == true)
        {
            utterance = CreateUtterance(utterance_rate_selector.value, utterance_pitch_selector.value, utterance_volume_selector.value, utterance_voice, utterance_original_text, 0, text_chunking_word_limit_selector.value, text_chunking_char_limit_selector.value);
            AddUtteranceToTtsQueue(utterance);

            // Reset the bool
            new_file = false;
        }

        // Some parameters of the voice changed
        if (voice_changed == true)
        {
            utterance = CreateUtterance(utterance_rate_selector.value, utterance_pitch_selector.value, utterance_volume_selector.value, utterance_voice, utterance_original_text, current_char, text_chunking_word_limit_selector.value, text_chunking_char_limit_selector.value);
            AddUtteranceToTtsQueue(utterance);

            // Reset the bool
            voice_changed = false;
        }

        if (speech_playing == true)
        {
            console.log("Pause");
            speech_playing = false;
            speech_synth.cancel();
        }

        else
        {
            console.log("Play");
            speech_playing = true;
            utterance = CreateUtterance(utterance_rate_selector.value, utterance_pitch_selector.value, utterance_volume_selector.value, utterance_voice, utterance_original_text, current_char, text_chunking_word_limit_selector.value, text_chunking_char_limit_selector.value);
            AddUtteranceToTtsQueue(utterance);
        }
    }

    // File
    utterance_text_selector.addEventListener('change', function(event)
    {
        // Get the selected file
        const file = event.target.files[0];

        if (!file)
        {
            // Exit if no file was selected
            return;
        }

        // Create a new FileReader instance
        const reader = new FileReader();

        // Define what happens when the file is successfully read
        reader.onload = (e) =>
        {
            const contents = e.target.result;

            // Save the clean text for the TTS engine to read it
            utterance_original_text = contents;
            utterance_text = contents;

            text_viewer_before.textContent = contents; // Load it
            
            // Notify to the rest of the program that a new file was loaded
            new_file = true;
        };

        // Define what happens in case of an error
        reader.onerror = (e) =>
        {
            alert("Error reading file", e);
        };

        // Trigger the read process (reads the file as a text string)
        reader.readAsText(file, "utf8");
    });


    // Voice synth functions
    function GetVoiceServiceType(voice)
    {
        if (voice.localService == true)
        {
            return "offline";
        }
        return "online";
    }

    function GetVoice(voice_type, voice_name, lang)
    {
        return FilterVoices(voice_type, voice_name, lang, speech_synth.getVoices())[0];
    }

    function FilterVoices(voice_type, voice_name, lang, voice_list)
    {
        let filtered_voice_list = [];

        for (const voice of voice_list)
        {
            // If the value is unset, consider it a match
            if (
                (voice_name == "" || voice.name.toLowerCase().includes(voice_name.toLowerCase())) &&
                (voice_type == "both" || voice_type == GetVoiceServiceType(voice)) &&
                (lang == "" || voice.lang.toLowerCase().includes(lang.toLowerCase()))
            )
            {
                filtered_voice_list.push(voice);
            }
        }
        return filtered_voice_list;
    }

    function UI_LoadVoicesIntoHTML()
    {
        // Get voices and sort it by language
        let voices = speech_synth.getVoices().sort(function (a, b) {
            const alang = a.lang.toUpperCase();
            const blang = b.lang.toUpperCase();

            if (alang < blang) {return -1;}
            else if (alang == blang) {return 0;}
            else {return +1;}
        });

        // Filter the voices before loading into the DOM
        voices = FilterVoices(
            document.querySelector('input[name="utterance_voice_type"]:checked').value, utterance_voice_search.value, utterance_lang_search.value, voices);

        // Build HTML string
        voice_list = "";

        for (const voice of voices)
        {
            const voice_func = `utterance_voice = GetVoice(\'${GetVoiceServiceType(voice)}\', \'${voice.name}\', \'${voice.lang}\')`;

            voice_list += `<div><input type="radio" id="voice_${voice.name}" name="utterance_voice_radio" onclick="${voice_func}"><label for="voice_${voice.name}">${voice.lang} - ${voice.name}</label></div>`;
        }

        // Insert HTML
        voice_list_html.innerHTML = voice_list;
    }

    // Voice load
    speech_synth.addEventListener("voiceschanged", (event) => 
    {
        UI_LoadVoicesIntoHTML();
    });

    utterance_voice_search.addEventListener("input", ()=>

    // Language search
    utterance_lang_search.addEventListener("input", ()=>

    });

    // Voice type search
    for (const radio of utterance_voice_type_radio_btns)
    {

    // --------------------------- Unit tests --------------------------- //
    
    class UnitTests
    {
        #tests
        constructor()
        {
            this.tests = {};
        }

        add(test_name, test_function)
        {
            // Check if it is a duplicate by name
            if (test_name in this.tests)
            {
                throw new Error(`Duplicate test: ${test_name}`);
            }

            // Add it
            this.tests[test_name] = test_function
        }

        run()
        {
            for (const test_name in this.tests)
            {
                // Run the test
                const test_return = this.tests[test_name]();
                const test_result = test_return.result;
                const test_msg = test_return.msg;

                if (test_result == true)
                {
                    console.log(`%c${test_name}: SUCCESS`, "background: rgba(0, 128, 0, 0.4); padding: 4px; border-radius: 4px;")
                }
                else
                {
                    console.error(`${test_name}: FAILED - MESSAGE -> \n${test_msg}`)
                }
            }

        }
    }
